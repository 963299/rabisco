<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0620">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>NeonDraw</title>
<style>
:root{--bg:#0b0620;--card:#150c3a;--line:#2f2570;--ink:#efeaff;--n1:#00e5ff;--n2:#ff2bd6;--n3:#39ff14;--n4:#ffe600}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font:600 15px/1.25 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
body{background:radial-gradient(120% 80% at 50% -10%,#231061 0,var(--bg) 60%);padding-top:env(safe-area-inset-top,0px)}
section{height:100%;display:flex;flex-direction:column}
.btn{min-height:44px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;padding:0 12px;cursor:pointer}
.btn.ic{flex:0 0 44px;padding:0;font-size:20px}
.btn[aria-pressed=true]{border-color:var(--n1);color:#fff;box-shadow:0 0 12px var(--n1),inset 0 0 10px #00e5ff44}
.btn:disabled{opacity:.35}
.btn:active{transform:scale(.97)}
button:focus-visible,input:focus-visible{outline:2px solid var(--n4);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}
.glow{text-shadow:0 0 6px var(--n1),0 0 18px var(--n2)}
/* home */
header{display:flex;align-items:center;gap:12px;padding:14px 16px 6px}
header img{width:48px;height:48px;border-radius:12px;box-shadow:0 0 14px var(--n1),0 0 28px #ff2bd655}
h1{margin:0;font-size:28px;letter-spacing:.5px}
#home main{flex:1;overflow-y:auto;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px))}
#free{width:100%;min-height:58px;font-size:18px;border-color:var(--n2);box-shadow:0 0 14px #ff2bd688,inset 0 0 12px #ff2bd633;margin-bottom:18px}
h2{font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--n1);margin:0 0 10px;font-weight:700}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);color:var(--ink);font:inherit;cursor:pointer;position:relative}
.card svg{width:100%;aspect-ratio:1;fill:none;stroke:var(--n2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px var(--n2))}
.card.done{border-color:var(--n3);box-shadow:0 0 12px #39ff1455}
.card.done::after{content:"★";position:absolute;top:6px;right:10px;color:var(--n4);font-size:22px;text-shadow:0 0 8px var(--n4)}
/* draw */
#bar{padding:8px 10px}
#ttl{flex:1;text-align:center;font-size:16px}
#stage{flex:1;min-height:0;position:relative;margin:0 10px;border-radius:16px;border:1.5px solid var(--line);background:#07031a;overflow:hidden;touch-action:none;box-shadow:inset 0 0 30px #00e5ff14}
#guide{position:absolute;inset:6%;width:88%;height:88%;overflow:visible;pointer-events:none}
#guide *{fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
#gd *{stroke:var(--n1);opacity:.3}
#gc{filter:drop-shadow(0 0 1.5px var(--n1)) drop-shadow(0 0 4px var(--n2))}
#gc *{stroke:#fff;stroke-dasharray:3 2.5;animation:d 1.2s linear infinite}
@keyframes d{to{stroke-dashoffset:-11}}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#dock{display:grid;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
#stepbar span{flex:1;text-align:center;font-size:14px;color:var(--n4)}
.pal{overflow-x:auto;scrollbar-width:none;padding:4px 2px}
.pal::-webkit-scrollbar{display:none}
.sw{flex:0 0 32px;height:32px;border-radius:50%;border:0;padding:0;cursor:pointer}
.sw[aria-pressed=true]{outline:2px solid #fff;outline-offset:2px}
#custom{flex:0 0 32px;width:32px;height:32px;border:0;padding:0;background:none;cursor:pointer}
#size{flex:1;min-width:0;accent-color:var(--n2)}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);padding:14px 22px;border-radius:16px;background:#150c3aee;border:1.5px solid var(--n3);box-shadow:0 0 22px var(--n3);font-size:20px;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.on{opacity:1}
</style>
</head>
<body>
<section id="home">
  <header><img src="icon-192.png" alt=""><h1 class="glow">NeonDraw</h1></header>
  <main>
    <button class="btn" id="free">✨ Desenho livre</button>
    <h2>Aulas</h2>
    <div id="grid"></div>
  </main>
</section>

<section id="draw" hidden>
  <div class="row" id="bar">
    <button class="btn ic" id="back" aria-label="Voltar">←</button>
    <div id="ttl" class="glow"></div>
    <button class="btn ic" id="undo" aria-label="Desfazer">↶</button>
    <button class="btn ic" id="redo" aria-label="Refazer">↷</button>
    <button class="btn ic" id="save" aria-label="Salvar imagem">⤓</button>
  </div>
  <div id="stage">
    <svg id="guide" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"><g id="gd"></g><g id="gc"></g></svg>
    <canvas id="cv"></canvas>
  </div>
  <div id="dock">
    <div class="row" id="stepbar" hidden>
      <button class="btn ic" id="prev" aria-label="Passo anterior">◀</button>
      <span id="stxt"></span>
      <button class="btn" id="next">▶</button>
    </div>
    <div class="row" id="tools">
      <button class="btn" data-tool="neon" aria-pressed="true" style="flex:1">Neon</button>
      <button class="btn" data-tool="rainbow" aria-pressed="false" style="flex:1">Arco-íris</button>
      <button class="btn" data-tool="eraser" aria-pressed="false" style="flex:1">Borracha</button>
      <button class="btn ic" id="tg" aria-pressed="true" aria-label="Mostrar guia">👁</button>
      <button class="btn ic" id="clear" aria-label="Limpar">✕</button>
    </div>
    <div class="row pal" id="pal"><input type="color" id="custom" value="#00e5ff" aria-label="Outra cor"></div>
    <div class="row"><input type="range" id="size" min="2" max="30" value="8" aria-label="Espessura"></div>
  </div>
</section>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
/* ---------- aulas: cada passo = [dica, fragmento SVG em 100x100] ---------- */
const L=[
{id:'estrela',n:'Estrela feliz',s:[['Desenhe a estrela','<polygon points="50,10 61,38 92,38 67,57 77,88 50,69 23,88 33,57 8,38 39,38"/>'],['Faça os olhinhos','<circle cx="42" cy="48" r="3"/><circle cx="58" cy="48" r="3"/>'],['Agora o sorriso','<path d="M42 58 Q50 66 58 58"/>']]},
{id:'coracao',n:'Coração',s:[['Desenhe o coração','<path d="M50 86C8 56 14 18 38 21 46 22 50 29 50 34 50 29 54 22 62 21 86 18 92 56 50 86Z"/>'],['Faça um brilho','<path d="M26 36Q28 28 36 28"/>'],['Faça um sorriso','<path d="M42 50Q50 58 58 50"/>']]},
{id:'casa',n:'Casinha',s:[['Desenhe as paredes','<path d="M20 45H80V86H20Z"/>'],['Agora o telhado','<path d="M11 47L50 14 89 47Z"/>'],['Faça a porta','<path d="M43 86V62H57V86"/>'],['Faça a janela','<path d="M64 54H75V66H64ZM69.5 54V66M64 60H75"/>']]},
{id:'gato',n:'Gatinho',s:[['Desenhe a cabeça','<circle cx="50" cy="56" r="30"/>'],['Faça as orelhas','<path d="M26 36L24 12 44 27M74 36L76 12 56 27"/>'],['Faça os olhos','<circle cx="40" cy="52" r="4"/><circle cx="60" cy="52" r="4"/>'],['Nariz e boca','<path d="M46 62H54L50 67ZM50 67V72M50 72Q44 78 38 72M50 72Q56 78 62 72"/>'],['Faça os bigodes','<path d="M30 64L10 60M30 70L10 74M70 64L90 60M70 70L90 74"/>']]},
{id:'peixe',n:'Peixinho',s:[['Desenhe o corpo','<path d="M14 50Q44 18 76 50 44 82 14 50Z"/>'],['Agora a cauda','<path d="M76 50L92 34V66Z"/>'],['Faça o olho','<circle cx="31" cy="46" r="3.5"/>'],['Faça a barbatana','<path d="M46 44Q54 50 46 58"/>'],['Faça as bolhas','<circle cx="14" cy="28" r="3"/><circle cx="22" cy="18" r="4"/>']]},
{id:'flor',n:'Flor',s:[['Desenhe o miolo','<circle cx="50" cy="42" r="9"/>'],['Faça as pétalas','<circle cx="50" cy="22" r="10"/><circle cx="70" cy="36" r="10"/><circle cx="62" cy="60" r="10"/><circle cx="38" cy="60" r="10"/><circle cx="30" cy="36" r="10"/>'],['Desenhe o caule','<path d="M50 70V92"/>'],['Faça uma folha','<path d="M50 84Q68 72 76 80 66 94 50 84Z"/>']]}
];
const COLORS=['#00e5ff','#ff2bd6','#39ff14','#ffe600','#ff7a00','#ff3b3b','#a66bff','#ffffff'];
let prog={};try{prog=JSON.parse(localStorage.getItem('neon-prog')||'{}')}catch(e){}

/* ---------- navegação ---------- */
function show(id){$('#home').hidden=id!=='home';$('#draw').hidden=id!=='draw'}
function home(){
  $('#grid').innerHTML='';
  L.forEach(a=>{
    const b=document.createElement('button');b.className='card'+(prog[a.id]?' done':'');
    b.innerHTML='<svg viewBox="0 0 100 100">'+a.s.map(x=>x[1]).join('')+'</svg><span>'+a.n+'</span>';
    b.onclick=()=>openDraw(a);$('#grid').appendChild(b);
  });
}
let lesson=null,step=0;
function openDraw(a){
  lesson=a;step=0;show('draw');
  $('#ttl').textContent=a?a.n:'Desenho livre';
  $('#stepbar').hidden=!a;$('#tg').hidden=!a;$('#guide').style.display=a?'block':'none';
  fit();c.clearRect(0,0,cv.width,cv.height);undo=[];redo=[];sync();guide();
}
function guide(){
  if(!lesson)return;
  const n=lesson.s.length;
  $('#gd').innerHTML=lesson.s.slice(0,step).map(x=>x[1]).join('');
  $('#gc').innerHTML=lesson.s[step][1];
  $('#stxt').textContent='Passo '+(step+1)+'/'+n+': '+lesson.s[step][0];
  $('#prev').disabled=step===0;
  $('#next').textContent=step===n-1?'Concluir ⭐':'▶';
}
$('#prev').onclick=()=>{step--;guide()};
$('#next').onclick=()=>{
  if(step<lesson.s.length-1){step++;guide();return}
  prog[lesson.id]=1;try{localStorage.setItem('neon-prog',JSON.stringify(prog))}catch(e){}
  toast('Parabéns! ⭐ Você arrasou!');home();show('home');
};
$('#free').onclick=()=>openDraw(null);
$('#back').onclick=()=>show('home');
$('#tg').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);$('#guide').style.visibility=on?'visible':'hidden'};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}

/* ---------- canvas ---------- */
const cv=$('#cv'),c=cv.getContext('2d',{willReadFrequently:true}),st=$('#stage');
let tool='neon',color=COLORS[0],size=8,dpr=1,undo=[],redo=[],pts=[],drawing=false,hue=0;
function fit(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  const w=Math.round(st.clientWidth*dpr),h=Math.round(st.clientHeight*dpr);
  if(!w||!h||(cv.width===w&&cv.height===h))return;
  const t=document.createElement('canvas');t.width=cv.width;t.height=cv.height;
  t.getContext('2d').drawImage(cv,0,0);cv.width=w;cv.height=h;c.drawImage(t,0,0);undo=[];redo=[];sync();
}
addEventListener('resize',fit);
const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*dpr,y:(e.clientY-r.top)*dpr,p:e.pointerType==='pen'&&e.pressure?e.pressure:.5}}
function W(q){const b=size*dpr*(tool==='eraser'?2.5:1);return tool==='eraser'?b:b*(.6+q.p*.8)}
function setup(q){
  const col=tool==='eraser'?'#000':tool==='rainbow'?'hsl('+(hue%360)+',100%,60%)':color;
  c.lineCap=c.lineJoin='round';c.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';
  c.strokeStyle=c.fillStyle=col;c.shadowColor=col;c.shadowBlur=tool==='eraser'?0:size*dpr*1.3+6;c.lineWidth=W(q);
}
function curve(a,b,d,q){if(tool==='rainbow')hue+=4;setup(q);c.beginPath();c.moveTo(a.x,a.y);c.quadraticCurveTo(b.x,b.y,d.x,d.y);c.stroke()}
function add(q){pts.push(q);const n=pts.length;
  if(n===2)curve(pts[0],pts[0],mid(pts[0],pts[1]),q);
  else if(n>2)curve(mid(pts[n-3],pts[n-2]),pts[n-2],mid(pts[n-2],pts[n-1]),q)}
function snap(){undo.push(c.getImageData(0,0,cv.width,cv.height));if(undo.length>15)undo.shift();redo=[];sync()}
cv.addEventListener('pointerdown',e=>{
  if(drawing)return;e.preventDefault();cv.setPointerCapture(e.pointerId);
  snap();drawing=true;const q=pos(e);setup(q);
  c.beginPath();c.arc(q.x,q.y,W(q)/2,0,7);c.fill();pts=[q];
});
cv.addEventListener('pointermove',e=>{
  if(!drawing)return;e.preventDefault();
  for(const ev of (e.getCoalescedEvents?e.getCoalescedEvents():[e]))add(pos(ev));
});
function end(){
  if(!drawing)return;drawing=false;const n=pts.length;
  if(n>1)curve(mid(pts[n-2],pts[n-1]),pts[n-1],pts[n-1],pts[n-1]);
  c.globalCompositeOperation='source-over';c.shadowBlur=0;pts=[];
}
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,end));

/* ---------- ações ---------- */
function step2(from,to){if(!from.length)return;to.push(c.getImageData(0,0,cv.width,cv.height));c.putImageData(from.pop(),0,0);sync()}
function sync(){$('#undo').disabled=!undo.length;$('#redo').disabled=!redo.length}
$('#undo').onclick=()=>step2(undo,redo);
$('#redo').onclick=()=>step2(redo,undo);
$('#clear').onclick=()=>{snap();c.clearRect(0,0,cv.width,cv.height)};
$('#save').onclick=()=>{
  const t=document.createElement('canvas');t.width=cv.width;t.height=cv.height;
  const x=t.getContext('2d');x.fillStyle='#07031a';x.fillRect(0,0,t.width,t.height);x.drawImage(cv,0,0);
  t.toBlob(async b=>{
    const f=new File([b],'neondraw-'+Date.now()+'.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(err){if(err.name==='AbortError')return}}
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  },'image/png');
};

/* ---------- ferramentas ---------- */
function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tool===t))}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
COLORS.forEach(h=>{
  const b=document.createElement('button');b.className='sw';b.dataset.c=h;b.style.background=h;b.style.boxShadow='0 0 10px '+h;
  b.setAttribute('aria-label','Cor '+h);b.onclick=()=>pick(h);$('#pal').insertBefore(b,$('#custom'));
});
function pick(h){color=h;if(tool!=='neon')setTool('neon');document.querySelectorAll('.sw').forEach(s=>s.setAttribute('aria-pressed',s.dataset.c===h))}
$('#custom').oninput=e=>pick(e.target.value);
$('#size').oninput=e=>{size=+e.target.value};
pick(COLORS[0]);home();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
