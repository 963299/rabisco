<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#06070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>NeonDraw</title>
<style>
:root{--bg:#06070f;--card:#0d1024;--line:#1f2657;--ink:#e8ecff;--dim:#8b95c9;--n1:#19e3ff;--n2:#ff3df0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font:500 15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
body{padding-top:env(safe-area-inset-top,0px)}
section{height:100%;display:flex;flex-direction:column}
.btn{min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;font-weight:600;padding:0 16px;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.3}
.btn.pri{border-color:var(--n1);color:#fff;box-shadow:0 0 14px #19e3ff40,inset 0 0 12px #19e3ff1f}
button:focus-visible{outline:2px solid var(--n1);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}
header img{width:42px;height:42px;border-radius:11px;box-shadow:0 0 16px #19e3ff55}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.3px}
header small{display:block;color:var(--dim);font-size:12px;font-weight:500}
#chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--line);background:none;color:var(--dim);font:inherit;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{color:#fff;border-color:var(--n2);box-shadow:0 0 12px #ff3df044}
#list{flex:1;overflow-y:auto;padding:0 16px calc(24px + env(safe-area-inset-bottom,0px))}
h2{margin:18px 0 10px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--n1);font-weight:700}
#list .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{position:relative;text-align:left;padding:10px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--ink);font:inherit;cursor:pointer}
.card svg{display:block;width:100%;aspect-ratio:1;background:#080a1a;border-radius:9px}
.card b{display:block;margin-top:8px;font-size:15px}
.card span{color:var(--dim);font-size:12px}
.card.ok{border-color:#19e3ff88}
.card.ok::after{content:"Concluída";position:absolute;top:16px;right:16px;font-size:11px;font-weight:700;color:#06070f;background:var(--n1);padding:2px 8px;border-radius:9px}
svg.art *{fill:none;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
.th *{stroke:#b9c6f5;stroke-width:1}
.th .k{display:none}
.th .f{fill:#b9c6f5}
/* lição */
#bar{display:flex;align-items:center;gap:10px;padding:10px 12px}
#bar .btn{min-height:44px;padding:0 14px}
#bar div{flex:1;min-width:0}
#lt{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lc{font-size:12px;color:var(--dim)}
#stage{margin:0 12px;border:1px solid var(--line);border-radius:16px;background:#080a1a;aspect-ratio:1;max-height:52vh;align-self:center;width:min(calc(100vw - 24px),52vh)}
#stage svg{display:block;width:100%;height:100%}
#prev *{stroke:#c5d0ee;stroke-width:1.1}
#prev .k{stroke:#4a6bd6;stroke-dasharray:2 2.4;opacity:.75}
#prev .f{fill:#c5d0ee}
#cur{filter:drop-shadow(0 0 1.2px var(--n1)) drop-shadow(0 0 3.5px #19e3ff99)}
#cur *{stroke:var(--n1);stroke-width:1.4}
#cur .k{stroke:var(--n2);stroke-dasharray:2 2.4}
#cur .f{fill:var(--n1)}
#info{flex:1;min-height:0;padding:14px 18px 6px;overflow-y:auto}
#sn{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--n2);font-weight:700}
#st{margin:2px 0 4px;font-size:20px;font-weight:700}
#tp{margin:0;color:#c9d1f5}
#prog{height:3px;background:var(--line);margin:0 18px}
#prog i{display:block;height:100%;width:0;background:var(--n1);box-shadow:0 0 8px var(--n1);transition:width .25s}
#nav{display:flex;gap:10px;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
#nav .btn{flex:1}
</style>
</head>
<body>
<section id="home">
  <header><img src="icon-192.png" alt=""><div><h1>NeonDraw</h1><small>Aprenda a desenhar passo a passo</small></div></header>
  <div id="chips"></div>
  <div id="list"></div>
</section>
<section id="lesson" hidden>
  <div id="bar"><button class="btn" id="back" aria-label="Voltar">Voltar</button><div><div id="lt"></div><div id="lc"></div></div></div>
  <div id="stage"><svg class="art" viewBox="0 0 100 100"><g id="prev"></g><g id="cur"></g></svg></div>
  <div id="prog"><i></i></div>
  <div id="info"><div id="sn"></div><div id="st"></div><p id="tp"></p></div>
  <div id="nav"><button class="btn" id="pv">Anterior</button><button class="btn pri" id="nx">Próximo</button></div>
</section>
<script>
const $=s=>document.querySelector(s);
/* Formato da aula: [titulo, dica, fragmento SVG (viewBox 100x100), apagarGuias?]
   class="k" = linha de construção (guia tracejada); class="f" = preenchido. */
const CATS=['Todos','Animais','Pessoas','Prédios','Paisagens'];
const NV=['Iniciante','Básico','Intermediário'];
const L=[
{id:'casa',c:'Prédios',v:1,n:'Casa simples',s:[
['Paredes','Comece com um retângulo mais largo que alto. Use traços leves.','<rect x="20" y="46" width="60" height="38"/>'],
['Telhado','Suba duas retas dos cantos de cima até se encontrarem no meio. Deixe o telhado passar um pouco da parede.','<path d="M14 46L50 18 86 46"/>'],
['Porta','A porta fica no centro e termina na linha do chão.','<path d="M44 84V60H56V84"/><circle cx="53" cy="72" r=".9" class="f"/>'],
['Janelas','Duas janelas quadradas na mesma altura, com uma cruz dentro de cada uma.','<rect x="26" y="54" width="12" height="12"/><path d="M32 54V66M26 60H38"/><rect x="62" y="54" width="12" height="12"/><path d="M68 54V66M62 60H74"/>'],
['Chaminé e chão','A chaminé sai do telhado. Termine com uma linha de chão.','<path d="M66 30V20H74V36.6"/><path d="M8 84H92"/>']]},
{id:'montanhas',c:'Paisagens',v:1,n:'Montanhas e sol',s:[
['Horizonte','Uma linha reta, um pouco abaixo do meio da folha.','<path d="M6 70H94"/>'],
['Cordilheira','Faça picos e vales em zigue-zague com alturas diferentes. Evite picos iguais.','<path d="M6 70L28 36 42 54 56 28 76 56 86 46 94 58V70"/>'],
['Neve nos picos','Um zigue-zague curto perto do topo das duas maiores montanhas.','<path d="M49.5 40L53 36 56 41 60 37 66 42"/><path d="M23.5 43L26 40 28 45 31 40 34.2 44"/>'],
['Sol','Um círculo no céu, longe dos picos, com pequenos raios ao redor.','<circle cx="78" cy="22" r="8"/><path d="M78 8V11M78 33V36M64 22H67M89 22H92M68 12L70 14M88 12L86 14"/>'],
['Nuvem e água','Nuvem com contorno de ondas. Abaixo do horizonte, traços horizontais curtos.','<path d="M10 22H34Q38 22 38 18 38 14 33 14 31 9 25 10 20 8 18 13 12 12 12 17 8 18 10 22Z"/><path d="M14 78H40M50 82H84M24 88H60"/>']]},
{id:'gato',c:'Animais',v:1,n:'Gato (rosto)',s:[
['Cabeça e guias','Desenhe um círculo e uma cruz leve por dentro. A linha horizontal marca onde ficam os olhos.','<circle cx="50" cy="52" r="28"/><path class="k" d="M50 24V80M22 52H78"/>'],
['Orelhas','Dois triângulos nas laterais de cima, com pontas um pouco para fora.','<path d="M26 36L24 12 44 26M74 36L76 12 56 26"/>'],
['Olhos','Olhos em forma de amêndoa sobre a linha da cruz, com uma pupila em cada.','<path d="M34 50Q40 44 46 50Q40 55 34 50Z"/><path d="M54 50Q60 44 66 50Q60 55 54 50Z"/><circle cx="40" cy="50" r="2" class="f"/><circle cx="60" cy="50" r="2" class="f"/>'],
['Nariz e boca','Um triângulo pequeno no centro, uma linha para baixo e dois arcos formando a boca.','<path d="M46 60H54L50 65Z"/><path d="M50 65V69M50 69Q45 74 40 70M50 69Q55 74 60 70"/>'],
['Bigodes e acabamento','Três bigodes de cada lado e o interior das orelhas. Apague as guias.','<path d="M32 62L12 58M32 66L12 68M68 62L88 58M68 66L88 68"/><path d="M30 30V20L38 26M70 30V20L62 26"/>',1]]},
{id:'coruja',c:'Animais',v:2,n:'Coruja',s:[
['Corpo oval','Um oval alto. A linha central ajuda a manter os dois lados iguais.','<ellipse cx="50" cy="56" rx="26" ry="34"/><path class="k" d="M50 22V90M24 46H76"/>'],
['Tufos','Dois pequenos triângulos no alto da cabeça.','<path d="M30 34L24 16 40 26M70 34L76 16 60 26"/>'],
['Olhos grandes','Dois círculos grandes sobre a linha horizontal, sem se tocarem. Pupila preenchida.','<circle cx="39" cy="46" r="9"/><circle cx="61" cy="46" r="9"/><circle cx="39" cy="46" r="3.5" class="f"/><circle cx="61" cy="46" r="3.5" class="f"/>'],
['Bico','Um pequeno triângulo apontando para baixo, entre os olhos.','<path d="M46 54L50 64 54 54Z"/>'],
['Asas','Duas curvas nas laterais do corpo, do alto até a base.','<path d="M28 58Q16 72 26 88M72 58Q84 72 74 88"/>'],
['Penas e galho','Curvas repetidas no peito e um galho embaixo. Apague as guias.','<path d="M40 72Q44 76 48 72 52 76 56 72M40 80Q44 84 48 80 52 84 56 80"/><path d="M14 92H86"/>',1]]},
{id:'rosto',c:'Pessoas',v:2,n:'Rosto de frente',s:[
['Formato e guias','O rosto é um oval mais largo em cima. Os olhos ficam na metade da altura. Marque a linha dos olhos, do nariz e da boca.','<path d="M26 44C26 22 36 16 50 16S74 22 74 44C74 62 64 76 50 80S26 62 26 44Z"/><path class="k" d="M50 12V84M26 48H74M36 64H64M40 70H60"/>'],
['Olhos','Entre os olhos cabe a largura de mais um olho. Preencha as pupilas.','<path d="M32 48Q38 43 44 48Q38 51 32 48Z"/><path d="M56 48Q62 43 68 48Q62 51 56 48Z"/><circle cx="38" cy="47.5" r="2" class="f"/><circle cx="62" cy="47.5" r="2" class="f"/>'],
['Sobrancelhas','Acima dos olhos, curvas suaves que acompanham o formato deles.','<path d="M31 41Q38 37 45 40M55 40Q62 37 69 41"/>'],
['Nariz','Uma linha leve do meio dos olhos até a base e a curva das narinas na linha do nariz.','<path d="M50 50V60M44 62Q47 65 50 64 53 65 56 62"/>'],
['Boca','A boca fica na linha inferior. A linha do meio é mais escura que o lábio de baixo.','<path d="M42 70Q50 68 58 70M44 70Q50 75 56 70"/>'],
['Orelhas e cabelo','As orelhas ficam entre a linha dos olhos e a do nariz. Desenhe o cabelo e apague as guias.','<path d="M26 44Q20 44 21 52Q22 58 27 58M74 44Q80 44 79 52Q78 58 73 58"/><path d="M26 40C26 18 40 12 52 13 64 14 74 22 74 40 66 32 58 26 44 24 36 30 30 34 26 40Z"/>',1]]},
{id:'porsol',c:'Paisagens',v:2,n:'Pôr do sol com pinheiros',s:[
['Horizonte e sol','Uma linha de horizonte e meio círculo apoiado nela.','<path d="M6 66H94"/><path d="M34 66A16 16 0 0 1 66 66"/>'],
['Raios e nuvens','Raios curtos em volta do sol e faixas finas de nuvem no céu.','<path d="M50 44V38M32 50L28 46M68 50L72 46M22 60H16M78 60H84"/><path d="M12 28H40M56 24H88M26 34H52"/>'],
['Montanhas ao fundo','Uma montanha de cada lado do sol, sem cobri-lo.','<path d="M6 66L18 48 34 66M66 66L82 46 94 62"/>'],
['Pinheiros','Desenhe cada pinheiro em zigue-zague, de cima para baixo. O segundo é menor.','<path d="M22 58L30 72 26 72 33 84 28 84 36 96H8L16 84 11 84 18 72 14 72Z"/><path transform="translate(56 22) scale(.75)" d="M22 58L30 72 26 72 33 84 28 84 36 96H8L16 84 11 84 18 72 14 72Z"/>'],
['Chão','Traços horizontais entre os pinheiros dão a ideia de campo ou água.','<path d="M40 74H62M36 80H70M44 86H58"/>']]},
{id:'corpo',c:'Pessoas',v:3,n:'Corpo humano (proporções)',s:[
['Cabeça e medidas','O corpo tem cerca de 8 cabeças de altura. Marque 8 medidas iguais e desenhe a cabeça na primeira.','<path class="k" d="M50 3V96M40 14.6H60M40 26.2H60M40 37.8H60M40 49.4H60M40 61H60M40 72.6H60M40 84.2H60M40 95.8H60"/><ellipse cx="50" cy="9" rx="5.5" ry="6.5"/>'],
['Tronco e quadril','Ombros com cerca de 2 cabeças de largura. O quadril fica na metade do corpo.','<path d="M46 15V20M54 15V20"/><path d="M38 20H62L58 38H42Z"/><path d="M42 42H58L60 50H40Z"/>'],
['Braços','Os cotovelos ficam na altura da cintura. As mãos chegam até o meio da coxa.','<path d="M38 21L33 38 30 52M62 21L67 38 70 52"/><ellipse cx="29.5" cy="56" rx="2.5" ry="4.5"/><ellipse cx="70.5" cy="56" rx="2.5" ry="4.5"/>'],
['Pernas','O joelho fica na metade da perna. Os pés apontam levemente para fora.','<path d="M44 50L42 73 41 92M56 50L58 73 59 92"/><path d="M41 92L35 96H42M59 92L65 96H58"/>'],
['Articulações','Marque ombros, cotovelos e joelhos com círculos: é onde o corpo dobra.','<circle class="k" cx="38" cy="21" r="2"/><circle class="k" cx="62" cy="21" r="2"/><circle class="k" cx="33" cy="38" r="2"/><circle class="k" cx="67" cy="38" r="2"/><circle class="k" cx="42" cy="73" r="2"/><circle class="k" cx="58" cy="73" r="2"/>'],
['Revise','Apague as guias e confira: o meio do corpo está no quadril.','',1]]},
{id:'rua',c:'Prédios',v:3,n:'Rua em perspectiva',s:[
['Horizonte e ponto de fuga','Desenhe a linha do horizonte e marque um ponto no meio: o ponto de fuga. Todas as linhas de profundidade apontam para ele.','<path class="k" d="M4 45H96"/><circle cx="50" cy="45" r="1.2" class="f"/>'],
['Prédio da esquerda','Ligue o topo e a base da parede ao ponto de fuga, depois corte com uma vertical.','<path class="k" d="M6 10L50 45M6 88L50 45"/><path d="M6 10L30 29.1V64.5L6 88Z"/>'],
['Prédio da direita','Faça o mesmo do outro lado, espelhando o desenho.','<path class="k" d="M94 10L50 45M94 88L50 45"/><path d="M94 10L70 29.1V64.5L94 88Z"/>'],
['Andares','As linhas dos andares também caminham para o ponto de fuga.','<path d="M6 34L30 40M6 58L30 50.9M94 34L70 40M94 58L70 50.9"/>'],
['Janelas e rua','Divisórias verticais para as janelas e faixas no meio da rua, cada vez menores.','<path d="M14 16.4V80.2M22 22.7V72.4M86 16.4V80.2M78 22.7V72.4"/><path d="M50 98V80M50 74V66M50 62V57"/>',1]]}
];
let done=[];try{done=JSON.parse(localStorage.getItem('nd-done')||'[]')}catch(e){}
let cat='Todos',cur=null,step=0;
const show=id=>{$('#home').hidden=id!=='home';$('#lesson').hidden=id!=='lesson'};
function chips(){
  $('#chips').innerHTML='';
  CATS.forEach(c=>{const b=document.createElement('button');b.className='chip';b.textContent=c;b.setAttribute('aria-pressed',c===cat);b.onclick=()=>{cat=c;chips();list()};$('#chips').appendChild(b)});
}
function list(){
  const el=$('#list');el.innerHTML='';
  [1,2,3].forEach(v=>{
    const a=L.filter(l=>l.v===v&&(cat==='Todos'||l.c===cat));if(!a.length)return;
    const h=document.createElement('h2');h.textContent='Nível '+v+' · '+NV[v-1];el.appendChild(h);
    const g=document.createElement('div');g.className='g';
    a.forEach(l=>{const b=document.createElement('button');b.className='card'+(done.includes(l.id)?' ok':'');
      b.innerHTML='<svg class="art th" viewBox="0 0 100 100">'+l.s.map(x=>x[2]).join('')+'</svg><b>'+l.n+'</b><span>'+l.c+' · '+l.s.length+' passos</span>';
      b.onclick=()=>open(l);g.appendChild(b)});
    el.appendChild(g);
  });
}
function open(l){cur=l;step=0;show('lesson');render()}
function render(){
  const S=cur.s;let cut=-1;for(let i=0;i<=step;i++)if(S[i][3])cut=i;
  $('#prev').innerHTML=S.slice(0,step).map(x=>x[2]).join('');
  if(cut>=0)$('#prev').querySelectorAll('.k').forEach(e=>e.remove());
  $('#cur').innerHTML=S[step][2];
  $('#lt').textContent=cur.n;$('#lc').textContent=cur.c+' · Nível '+cur.v+' · '+NV[cur.v-1];
  $('#sn').textContent='Passo '+(step+1)+' de '+S.length;$('#st').textContent=S[step][0];$('#tp').textContent=S[step][1];
  $('#prog i').style.width=((step+1)/S.length*100)+'%';
  $('#pv').disabled=step===0;$('#nx').textContent=step===S.length-1?'Concluir':'Próximo';
}
$('#pv').onclick=()=>{if(step>0){step--;render()}};
$('#nx').onclick=()=>{
  if(step<cur.s.length-1){step++;render();return}
  if(!done.includes(cur.id)){done.push(cur.id);try{localStorage.setItem('nd-done',JSON.stringify(done))}catch(e){}}
  list();show('home');
};
$('#back').onclick=()=>show('home');
chips();list();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
